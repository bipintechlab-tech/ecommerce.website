<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ShopEasy - E-Commerce Website</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Header -->
    <header>
      <div class="logo">ShopEasy</div>

      <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#about">About</a>
      </nav>

      <button id="cartBtn">🛒 Cart (<span id="cartCount">0</span>)</button>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">
      <div>
        <h1>Shop Smart. Shop Easy.</h1>

        <p>Discover amazing products at the best prices.</p>

        <a href="#products" class="shopBtn"> Shop Now </a>
      </div>
    </section>

    <!-- Products Section -->
    <section class="products-section" id="products">
      <h2>Our Products</h2>

      <!-- Search -->
      <input type="text" id="searchInput" placeholder="Search products..." />

      <!-- Categories -->
      <div class="categories">
        <button class="categoryBtn active" data-category="all">All</button>

        <button class="categoryBtn" data-category="electronics">
          Electronics
        </button>

        <button class="categoryBtn" data-category="fashion">Fashion</button>

        <button class="categoryBtn" data-category="shoes">Shoes</button>
      </div>

      <!-- Products -->
      <div class="products" id="productsContainer"></div>
    </section>

    <!-- Cart -->
    <div class="cart" id="cart">
      <div class="cartHeader">
        <h2>Your Cart</h2>

        <button id="closeCart">✖</button>
      </div>

      <div id="cartItems"></div>

      <div class="cartBottom">
        <h3>Total: ₹<span id="cartTotal">0</span></h3>

        <button id="checkoutBtn">Checkout</button>
      </div>
    </div>

    <!-- Overlay -->
    <div id="overlay"></div>

    <!-- About -->
    <section class="about" id="about">
      <h2>About ShopEasy</h2>

      <p>
        ShopEasy is a simple e-commerce website project created using HTML, CSS
        and JavaScript.
      </p>
    </section>

    <footer>
      <p>© 2026 ShopEasy. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
